<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Gallery | Hello, World!</title>
    <style>
      :root { color-scheme: dark; --text:#f8fafc; --muted:#cbd5e1; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; padding:7rem 1.25rem 3rem; background:#0f172a; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
      body::before,body::after { position:fixed; z-index:-1; width:42vmax; aspect-ratio:1; border-radius:50%; filter:blur(30px); opacity:.48; content:""; } body::before { top:-22vmax; left:-12vmax; background:#7c3aed; } body::after { right:-20vmax; bottom:-24vmax; background:#0891b2; }
      nav { position:fixed; top:1.25rem; left:50%; z-index:2; display:flex; gap:.25rem; padding:.35rem; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(15,23,42,.65); backdrop-filter:blur(12px); transform:translateX(-50%); } nav a { padding:.5rem .85rem; border-radius:999px; color:var(--muted); font-size:.9rem; font-weight:700; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--text); background:rgba(255,255,255,.12); }
      main { width:min(100%,1000px); margin:auto; } header { max-width:640px; margin:0 auto 2.4rem; text-align:center; animation:enter .7s ease both; } .eyebrow { margin:0 0 .6rem; color:#c4b5fd; font-size:.82rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3rem,8vw,5.5rem); line-height:1; letter-spacing:-.07em; background:linear-gradient(120deg,#fff,#c4b5fd,#7dd3fc); -webkit-background-clip:text; background-clip:text; color:transparent; } header p { color:var(--muted); line-height:1.7; }
      .grid { display:grid; grid-template-columns:repeat(12,1fr); grid-auto-rows:110px; gap:1rem; } figure { position:relative; display:flex; align-items:end; margin:0; padding:1.15rem; overflow:hidden; border:1px solid rgba(255,255,255,.18); border-radius:20px; box-shadow:0 18px 40px rgba(0,0,0,.2); isolation:isolate; transition:transform .2s ease, border-color .2s ease; animation:enter .7s ease both; } figure:hover { z-index:1; border-color:rgba(255,255,255,.5); transform:translateY(-5px); } figure::before { position:absolute; z-index:-1; inset:0; content:""; background:var(--art); transition:transform .35s ease; } figure:hover::before { transform:scale(1.08); } figure::after { position:absolute; z-index:-1; inset:0; content:""; background:linear-gradient(transparent 30%,rgba(2,6,23,.8)); } figcaption { font-weight:800; letter-spacing:.01em; } .a { grid-column:span 7; grid-row:span 3; --art:radial-gradient(circle at 25% 25%,#fef08a 0 8%,transparent 9%),linear-gradient(135deg,#ec4899,#7c3aed 60%,#0ea5e9); } .b { grid-column:span 5; grid-row:span 3; --art:radial-gradient(circle at 70% 30%,#a7f3d0 0 12%,transparent 13%),linear-gradient(145deg,#065f46,#0e7490); } .c { grid-column:span 4; grid-row:span 3; --art:linear-gradient(45deg,#f97316 25%,#facc15 25% 50%,#fb7185 50% 75%,#7c3aed 75%); } .d { grid-column:span 8; grid-row:span 3; --art:radial-gradient(ellipse at 35% 50%,#bae6fd 0 8%,transparent 9%),radial-gradient(ellipse at 70% 35%,#ddd6fe 0 12%,transparent 13%),linear-gradient(135deg,#172554,#4c1d95); } .e { grid-column:span 6; grid-row:span 3; --art:linear-gradient(135deg,#0f766e,#2dd4bf 45%,#ecfeff); } .f { grid-column:span 6; grid-row:span 3; --art:radial-gradient(circle at 50% 45%,#fda4af 0 14%,transparent 15%),linear-gradient(135deg,#881337,#4c1d95); } @keyframes enter { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } } @media (max-width:620px) { body { padding-top:6rem; } nav a { padding:.45rem .62rem; font-size:.78rem; } .grid { grid-auto-rows:100px; gap:.75rem; } .a,.b,.c,.d,.e,.f { grid-column:span 12; grid-row:span 2; } } @media (prefers-reduced-motion:reduce) { *,*::before { animation-duration:1ms !important; transition-duration:1ms !important; } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav>
    <main>
      <header><p class="eyebrow">Visual notes</p><h1>A little color.</h1><p>A collection of bright, abstract moments made to bring the site to life.</p></header>
      <section class="grid" aria-label="Artwork gallery"><figure class="a"><figcaption>Daydream</figcaption></figure><figure class="b"><figcaption>Stillwater</figcaption></figure><figure class="c"><figcaption>Playful geometry</figcaption></figure><figure class="d"><figcaption>Orbit</figcaption></figure><figure class="e"><figcaption>Sea glass</figcaption></figure><figure class="f"><figcaption>Afterglow</figcaption></figure></section>
    </main>
  </body>
</html>
