<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; --text:#f8fafc; --muted:#cbd5e1; } * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; background:#0f172a; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; } .glow { position:fixed; width:45vmax; aspect-ratio:1; border-radius:50%; filter:blur(24px); opacity:.65; animation:drift 12s ease-in-out infinite alternate; } .one { background:#9333ea; top:-20vmax; left:-16vmax; } .two { background:#0284c7; right:-17vmax; bottom:-22vmax; animation-delay:-4s; } nav { position:fixed; top:1.25rem; left:50%; z-index:2; display:flex; gap:.25rem; padding:.35rem; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(15,23,42,.55); backdrop-filter:blur(12px); transform:translateX(-50%); } nav a { padding:.5rem .85rem; border-radius:999px; color:var(--muted); font-size:.9rem; font-weight:700; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--text); background:rgba(255,255,255,.12); } main { width:min(92vw,680px); padding:clamp(2rem,7vw,4.5rem); text-align:center; border:1px solid rgba(255,255,255,.18); border-radius:28px; background:rgba(15,23,42,.64); box-shadow:0 25px 70px rgba(0,0,0,.35); backdrop-filter:blur(18px); animation:enter .7s cubic-bezier(.2,.8,.2,1) both; } h1 { margin:0 0 .75rem; font-size:clamp(3rem,9vw,5.5rem); letter-spacing:-.06em; line-height:1; background:linear-gradient(120deg,#fff,#c4b5fd,#7dd3fc); -webkit-background-clip:text; background-clip:text; color:transparent; } p { margin:0 auto 1.75rem; max-width:43ch; color:var(--muted); line-height:1.7; } form { display:grid; gap:1rem; text-align:left; } label { color:#e2e8f0; font-size:.9rem; font-weight:700; } input,textarea { width:100%; margin-top:.4rem; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.14); border-radius:12px; outline:0; background:rgba(255,255,255,.07); color:var(--text); font:inherit; } input:focus,textarea:focus { border-color:#a78bfa; box-shadow:0 0 0 3px rgba(167,139,250,.2); } textarea { min-height:105px; resize:vertical; } button { padding:.9rem 1.2rem; border:0; border-radius:12px; cursor:pointer; background:linear-gradient(135deg,#ddd6fe,#7dd3fc); color:#1e1b4b; font:inherit; font-weight:800; } #status { min-height:1.5em; margin:0; color:#a7f3d0; font-weight:700; } @keyframes enter { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } } @keyframes drift { to { transform:translate(10vmax,8vmax) scale(1.15); } } @media (prefers-reduced-motion:reduce) { * { animation-duration:1ms !important; } }
    </style>
  </head>
  <body>
    <div class="glow one"></div><div class="glow two"></div>
    <nav aria-label="Main navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <main>
      <h1>Let's talk.</h1><p>Have an idea, a question, or simply want to say hello? Drop a message below.</p>
      <form id="contact-form"><label>Name<input name="name" autocomplete="name" placeholder="Your name" required /></label><label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label><label>Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label><button type="submit">Send message</button><p id="status" aria-live="polite"></p></form>
    </main>
    <script>document.querySelector('#contact-form').addEventListener('submit', event => { event.preventDefault(); event.currentTarget.reset(); document.querySelector('#status').textContent = 'Thanks! Your message is ready to send. ✨'; });</script>
  </body>
</html>
